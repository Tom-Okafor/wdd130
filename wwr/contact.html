<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="This is the contact us for Whitewater Adventures. You can find reach us through this page and find out more about our location">
    <meta name="author" content="Chukwuemeka Tom Okafor">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us - Whitewater Adventures</title>
</head>

<body>
    <header>
        <img src="images/rafting-logo.png" alt="This is the rafting site logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a>
                </li>
                <li><a href="about.html">About Us</a>
                </li>
                <li><a href="trips.html">Trips</a>
                </li>
                <li><a href="contact.html">Contact Us</a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <article class="company-details">
            <h1>Whitewater Adventures</h1>
            <p>123 Whitewater Rd</p>
            <p>Idaho Springs</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewateradventures.com</p>
        </article>
        <section class="map-form">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m26!1m12!1m3!1d65342430.7104762!2d-135.2212147199401!3d1.639265569207506!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!4m11!3e6!4m3!3m2!1d4.7939584!2d7.022182399999999!4m5!1s0x876ba3487caaddd5%3A0x935a9ff575b1f7da!2sClear%20Creek%20Rafting%20Co.%2C%20350%20Whitewater%20Rd%2C%20Idaho%20Springs%2C%20CO%2080452%2C%20United%20States!3m2!1d39.743387!2d-105.479682!5e0!3m2!1sen!2sng!4v1791006527254!5m2!1sen!2sng"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <form action="">
                <div class="row">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Name">
                </div>
                <div class="row">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Your Email">
                </div>
                <div class="row">
                    <p>Message Purpose</p>
                    <div class="radio-block">
                        <div class="radio">
                            <input type="radio" name="purpose" id="inquiry" value="general inquiry">
                            <label for="purpose">General Inquiry</label>
                        </div>
                        <div class="radio">
                            <input type="radio" name="purpose" id="reservation"
                              value="reservation question">
                            <label for="purpose">Reservation Question</label>
                        </div>
                        <div class="radio">
                            <input type="radio" name="purpose" id="suggestion"
                              value="website suggestion">
                            <label for="purpose">Website Suggestion</label>
                        </div>
                    </div>
                </div>
                <div class="column">
                    <label for="message">Message</label>
                    <textarea name="message" id="message" placeholder="Type here"
                      rows="3"></textarea>
                </div>
                <div class="check">
                    <input type="checkbox" name="subscribe" id="subscribe" value="subscribe">
                    <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </section>
        <section class="profiles">
            <h2>We Are Here to Serve You</h2>
            <div>
                <figure>
                    <img src="images/woman-profile.jpg" alt="Dr. Mary Joseph">
                    <figcaption>
                        <span>Dr. Mary Joseph</span>
                        <span>Director</span>
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/man-profile.jpg" alt="Engr. Stephen Paul">
                    <figcaption>
                        <span>Engr. Stephen Paul</span>
                        <span>Technical Lead</span>
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/person-profile.jpg" alt="Dr. Tonye Finima">
                    <figcaption>
                        <span>Dr. Tonye Finima</span>
                        <span>Trip Analyst</span>
                    </figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 🛶 Whitewater Adventures 🛶 Chukwuemeka Okafor</p>
        <nav class="socialmedia">
            <a href="www.facebook.com"><img src="images/facebook.svg" alt="our facebook page"></a>
            <a href="www.instagram.com"><img src="images/instagram.svg"
                  alt="our Instagram page"></a>
            <a href="www.linkedin.com"><img src="images/linkedin.svg" alt="our LinkedIn page"></a>
        </nav>
    </footer>
</body>

</html>

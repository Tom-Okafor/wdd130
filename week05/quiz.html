<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML FORM</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <h1>☑️ Basic HTML and CSS quiz</h1>
    <form action="">
        <div>
            <span class="question-number">1.</span> <label for="q1">What does the acronym CSS stand
                for?</label>
            <input type="text" name="q1" id="q1">
        </div>
        <div>
            <span class="question-number">2.</span> <label for="q2">How are id and class attributes
                selected in CSS</label>
            <textarea name="q2" id="q2" rows="6"></textarea>
        </div>
        <div>
            <span class="question-number">3.</span> <label for="q3">Which of the following is a
                valid
                CSS comment</label>
            <select name="q3" id="q3">
                <option value="" selected disabled>Choose One ...</option>
                <option value="correct">/* color: green */</option>
                <option value="wrong-one"># color: green #</option>
                <option value="wrong-two">** color: green **</option>
            </select>
        </div>
        <div>
            <span class="question-number">4.</span> <label for="q4">What is the bottom margin given
                this declaration?</label>
            <p class="code-block">margin: 10px 5px 15px;</p>
            <input type="number" name="q4" id="q4">
        </div>
        <input type="submit" value="Submit Quiz">
    </form>
</body>

</html>
